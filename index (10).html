   Every card loaded from Firebase is saved in localStorage (as many as the browser allows).
   When storage is full the OLDEST cards are dropped automatically; the feed is always sorted newest-first. */
const CK="sx_cards_v2",MK="sx_meta_v2",CATK="sx_cats_v2";
const cmpC=(a,b)=>(b._s-a._s)||(b._n-a._n),gtK=(a,b)=>a[0]>b[0]||(a[0]==b[0]&&a[1]>b[1]);
const hyd=c=>{c.createdAt={toDate:()=>new Date(c._s*1000+Math.floor(c._n/1e6))};return c};
const ingest=d=>{const x=d.data(),ts=x.createdAt,{createdAt,updatedAt,...r}=x;return hyd({id:d.id,...r,_s:ts?.seconds??Math.floor(Date.now()/1000),_n:ts?.nanoseconds??0})};
function loadCache(){try{const a=JSON.parse(localStorage.getItem(CK)||"[]");return Array.isArray(a)?a.filter(c=>c&&c.id).map(hyd).sort(cmpC):[]}catch{return[]}}
function loadMeta(){try{const m=JSON.parse(localStorage.getItem(MK)||"{}");return m&&typeof m=="object"?m:{}}catch{return{}}}
function saveMeta(){try{localStorage.setItem(MK,JSON.stringify(S.meta))}catch{}}
function saveCache(){S.cards.sort(cmpC);const all=S.cards,n=all.length;
  if(!n){try{localStorage.removeItem(CK)}catch{}return}
  const put=k=>{try{localStorage.setItem(CK,JSON.stringify(all.slice(0,k).map(({createdAt,...r})=>r)));return true}catch{return false}};
  if(put(n))return;
  let k=n,ok=false;while(k>1){k=Math.max(1,k-Math.max(1,Math.floor(k*.04)));if(put(k)){ok=true;break}}
  if(!ok)return; /* storage unavailable: keep working from memory */
  S.cards=all.slice(0,k);const l=S.cards[k-1];S.meta.full=true;S.meta.oldest=[l._s,l._n];saveMeta()}
let _st;const saveSoon=()=>{clearTimeout(_st);_st=setTimeout(saveCache,1200)};

/* Fetch the next 10 cards that are not stored yet: newer ones first, then older ones (until storage is full) */
async function fetchFeed(){const col=collection(db,"cards"),m=S.meta;let docs,kind="new";
  if(!S.cards.length||!m.newest){docs=(await getDocs(query(col,orderBy("createdAt","desc"),limit(10)))).docs;kind="first"}
  else{docs=(await getDocs(query(col,where("createdAt",">",TSK(m.newest)),orderBy("createdAt","asc"),limit(10)))).docs;
   if(!docs.length&&!m.full&&m.oldest){docs=(await getDocs(query(col,where("createdAt","<",TSK(m.oldest)),orderBy("createdAt","desc"),limit(10)))).docs;kind="old"}}
  const have=new Map(S.cards.map(c=>[c.id,c]));let count=0,hi=m.newest,lo=m.oldest;
  docs.forEach(d=>{const c=ingest(d),k=[c._s,c._n];if(!have.has(c.id))count++;have.set(c.id,c);if(!hi||gtK(k,hi))hi=k;if(!lo||gtK(lo,k))lo=k});
  if(docs.length){S.cards=[...have.values()];S.meta.newest=hi;S.meta.oldest=lo;saveCache();saveMeta()}
  return{count,kind}}

 shell("profile",`<div class="box"><h2>${esc(S.p?.name)}</h2><p style="color:var(--mut);margin:4px 0 16px">${t("this_device")}</p><div class="stats"><div><b>${mine.length}</b>${t("st_cards")}</div><div><b>${lk}</b>${t("st_likes")}</div><div><b>${S.bms.size}</b>${t("st_saved")}</div></div><div class="stats" style="grid-template-columns:repeat(2,1fr);margin-top:14px"><div data-act="flist" data-v="fers" style="cursor:pointer"><b id="nfers">${S.fers.length}</b>${t("followers")}</div><div data-act="flist" data-v="fing" style="cursor:pointer"><b id="nfing">${S.fing.length}</b>${t("following_lbl")}</div></div><div id="fl"></div></div>
${S.u&&!S.u.isAnonymous?`<div class="box"><p style="color:var(--mut);margin-bottom:12px;word-break:break-all">${esc(S.u.email||"")}</p><button class="btn red" id="lo" style="width:100%">${t("logout")}</button></div>`:""}<h2 style="margin:20px 0 12px">${t("my_cards")}</h2>
${mine.length?`<div class="grid">${mine.map(c=>`<div>${cardHTML(c)}<div class="row"><button class="btn sm ghost" data-go="edit/${c.id}">${t("edit")}</button><button class="btn sm red" data-act="del" data-id="${c.id}">${t("del")}</button></div></div>`).join("")}</div>`:`<div class="empty">${t("no_cards")}</div>`}`);
 const lo=$("#lo");if(lo)lo.onclick=async()=>{if(!confirm(t("logout_confirm")))return;try{await signOut(auth)}catch{}location.href=location.pathname}}
async function adminView(){if(S.p?.role!="admin")return go("home");shell("admin",spin);
 const [u,c]=await Promise.all([getDocs(collection(db,"users")),getDocs(collection(db,"categories"))]);
 shell("admin",`<h2>${t("nav_admin")}</h2><div class="box"><h3>${t("a_users")}</h3><table>${u.docs.map(d=>{const x=d.data();return`<tr><td>${esc(x.name)}<br>${esc(x.email)}</td><td>${x.role}</td><td><button class="btn sm ${x.disabled?"":"red"}" data-act="dis" data-id="${d.id}" data-v="${!x.disabled}">${x.disabled?t("enable"):t("disable")}</button></td></tr>`}).join("")}</table></div>
<div class="box"><h3>${t("a_cards")}</h3><table>${S.cards.map(x=>`<tr><td>${esc(x.title)}<br>${esc(x.authorName)}</td><td><button class="btn sm red" data-act="del" data-id="${x.id}">${t("del")}</button></td></tr>`).join("")}</table></div>
<div class="box"><h3>${t("a_cats")}</h3><p>${c.docs.map(d=>esc(d.data().name)).join(", ")||t("default_only")}</p><input id="nc" placeholder="${t("new_cat")}"><button class="btn sm" data-act="addcat">${t("add")}</button></div>`)}

// ---- actions (delegated)
async function toggleFollow(id,name){if(id==S.u.uid)return;const k=S.u.uid+"_"+id,r=doc(db,"follows",k);
 if(S.fw.has(id)){await deleteDoc(r);S.fw.delete(id);S.fing=S.fing.filter(x=>x.followingId!=id)}
 else{const d={followId:k,followerId:S.u.uid,followerName:S.p.name,followingId:id,followingName:name,createdAt:serverTimestamp()};await setDoc(r,d);S.fw.add(id);S.fing.push(d)}
 const f=$("#nfing");if(f)f.textContent=S.fing.length}
function renderSheet(){const old=$("#sheet"),top=old?.querySelector(".shl")?.scrollTop||0;old?.remove();const v=S.sv,d=document.createElement("div");d.id="sheet";d.className="sheet";
 d.innerHTML=`<div class="sh"><div class="shh"><b>${v=="fers"?t("followers"):t("following_lbl")} · ${S.snap.length}</b><button class="ic" data-act="fclose" aria-label="${t("close")}">✕</button></div><div class="shl">${S.snap.length?S.snap.map(r=>`<div class="fr"><span class="av">${esc((r.n||"?")[0].toUpperCase())}</span><b>${esc(r.n)}</b><button class="btn sm ${S.fw.has(r.id)?"ghost":""}" data-act="ftoggle" data-id="${r.id}" data-n="${esc(r.n)}">${S.fw.has(r.id)?t("following"):v=="fers"?t("follow_back"):t("follow")}</button></div>`).join(""):`<div class="empty">${t("no_one")}</div>`}</div></div>`;
 document.body.appendChild(d);d.querySelector(".shl").scrollTop=top}
document.addEventListener("click",async e=>{if(e.target.id=="sheet"){e.target.remove();return}

 const cat=e.target.closest("[data-cat]");if(cat){S.cat=cat.dataset.cat;if(!cat.closest("[data-go]")&&S.draw){document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.cat==S.cat));S.draw();return}}
 const a=e.target.closest("[data-act]");
 if(a){e.stopPropagation();const id=a.dataset.id,act=a.dataset.act;
  try{
    if(act=="glang"){setLang(LANG=="en"?"hi":"en");return}
    if(act=="share"){await shareCard(id);return}
     if(!S.u&&act!="fclose")return toast(t("please_wait"));
     if(act=="loadnew"){await loadMoreUI();return}
     if(act=="flist"){const v=a.dataset.v;S.sv=v;S.snap=S[v].map(x=>v=="fers"?{id:x.followerId,n:x.followerName}:{id:x.followingId,n:x.followingName});renderSheet()}
  if(act=="fclose")$("#sheet")?.remove();
  if(act=="ftoggle"){await toggleFollow(id,a.dataset.n);renderSheet()}
  if(act=="monapply"){if(S.fers.length<MON.minFollowers)return toast(t("not_enough"));await setDoc(doc(db,"monetization",S.u.uid),{userId:S.u.uid,name:S.p?.name||"",followers:S.fers.length,status:"pending",createdAt:serverTimestamp()});toast(t("app_sent"));route()}
  if(act=="follow"){await toggleFollow(id,a.dataset.n);route()}
  if(act=="like"){const c=getCard(id),k=S.u.uid+"_"+id,r=doc(db,"likes",k),b=writeBatch(db),had=S.likes.has(id);
   if(had){b.delete(r);b.update(doc(db,"cards",id),{likesCount:increment(-1)})}else{b.set(r,{likeId:k,userId:S.u.uid,cardId:id,createdAt:serverTimestamp()});b.update(doc(db,"cards",id),{likesCount:increment(1)})}
   await b.commit();had?S.likes.delete(id):S.likes.add(id);c.likesCount=(c.likesCount||0)+(had?-1:1);saveSoon();route()}
  if(act=="bm"){const k=S.u.uid+"_"+id,r=doc(db,"bookmarks",k);if(S.bms.has(id)){await deleteDoc(r);S.bms.delete(id)}else{await setDoc(r,{bookmarkId:k,userId:S.u.uid,cardId:id,createdAt:serverTimestamp()});S.bms.add(id)}route()}
  if(act=="del"&&confirm(t("confirm_del"))){await deleteDoc(doc(db,"cards",id));dropCard(id);saveCache();toast(t("deleted"));route()}
  if(act=="dis"){await updateDoc(doc(db,"users",id),{disabled:a.dataset.v=="true"});adminView()}
  if(act=="addcat"){const n=$("#nc").value.trim();if(n){await addDoc(collection(db,"categories"),{name:n,createdAt:serverTimestamp()});await loadCats();adminView()}}
  }catch(x){toast(x.message.replace("Firebase: ",""))}return}
 const g=e.target.closest("[data-go]");if(g){const v=g.dataset.go;if(v=="create"&&S.u&&S.u.isAnonymous){if(await googleGate(true))go("create");return}location.hash=="#/"+v?route():go(v)}});

// ---- bottom nav + keyboard behaviour
let ly=0,H=innerHeight,kb=false,sw=false;const navEl=()=>document.querySelector("nav.bot"),typing=()=>document.activeElement?.id=="q",showNav=()=>navEl()?.classList.remove("hide"),hideNav=()=>navEl()?.classList.add("hide");
addEventListener("scroll",()=>{const y=scrollY;if(Date.now()<(S.navLock||0)){ly=y;return}if(Math.abs(y-ly)<6)return;
 if(y>ly&&y>40){hideNav();if(typing())document.activeElement.blur()}else{if(!kb)showNav()}ly=y},{passive:true});
/* Header moves 1:1 with the scroll: slides up exactly as far as the page scrolls down, and comes back down at the same speed as the content scrolls up */
let hy=0;addEventListener("scroll",()=>{const y=scrollY,hd=document.querySelector(".top");
 if(hd){if(Date.now()>=(S.navLock||0)){const hh=hd.offsetHeight;let o=y<=0?0:Math.max(-hh,Math.min(0,(hd._o||0)-(y-hy)));hd._o=o;hd.style.transform=o?"translate3d(0,"+o+"px,0)":""}}
 hy=y},{passive:true});
document.addEventListener("touchmove",()=>{if(typing()){sw=true;document.activeElement.blur()}},{passive:true});
document.addEventListener("focusin",e=>{if(e.target.matches("input,textarea,select")){kb=true;hideNav()}});
document.addEventListener("focusout",()=>{kb=false;if(!sw||scrollY<=40)showNav();sw=false});
addEventListener("resize",()=>{H=Math.max(H,innerHeight);if(kb&&innerHeight>=H-120){kb=false;if(typing())document.activeElement.blur();showNav()}});
</script></body></html>
