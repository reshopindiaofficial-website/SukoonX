<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Noto+Sans+Devanagari:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f3;--ink:#2a1a30;--mut:#7a6a80;--card:#fff;--rose:#e2476b;--plum:#4b1f5e;--gold:#f4c27a;--line:#eadfe3;--r:22px}
*{box-sizing:border-box;margin:0}body{font-family:Inter,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.logo{font-family:Fraunces,'Noto Sans Devanagari',serif}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:99px;padding:13px 22px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--rose),#b02f6e);color:#fff;box-shadow:0 8px 24px #e2476b44;transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;box-shadow:none}.btn.sm{padding:8px 14px;font-size:13px}.btn.red{background:#b3261e}
input,select,textarea{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:6px 0 14px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}label{font-size:13px;color:var(--mut);font-weight:500}
#welcome{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px 18px;color:#fff;overflow:auto;background:radial-gradient(circle at 50% 78%,#ffc27a 0,#ff7a8a 14%,transparent 45%),linear-gradient(180deg,#1a1462 0%,#4d2796 34%,#c0468f 64%,#ff8f66 80%,#2a1050 100%)}
#welcome .glow{position:absolute;width:300px;height:300px;border-radius:50%;background:#ff7ac8;filter:blur(110px);opacity:.3;top:-60px;left:-80px;animation:fl 8s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(80px,90px)}}
.tagl{position:absolute;top:16px;right:18px;font:italic 13px/1.4 'Brush Script MT',cursive,Inter;color:#ffb3e6;text-align:right;opacity:.9}
.wc{position:relative;max-width:440px;width:100%;text-align:center;animation:rise .9s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.lotus{width:74px;filter:drop-shadow(0 0 14px #ff7ac8aa)}
.wc h1{font:800 50px Inter,sans-serif;letter-spacing:-2px;margin-top:2px}.wc h1 b{background:linear-gradient(135deg,#ff5fd0,#a77bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.wc small.sub{display:block;letter-spacing:.3em;font-size:11px;opacity:.75;margin:2px 0 22px}
.wc h2{font:700 24px/1.4 'Noto Sans Devanagari';margin-bottom:10px}.wc h2 span{display:block;font:800 30px Inter;background:linear-gradient(90deg,#ff7ac8,#c9a0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.wc p{opacity:.88;line-height:1.7;font-size:15px}
.b18{width:104px;height:104px;margin:20px auto;border-radius:50%;display:grid;place-content:center;font:800 32px Inter;line-height:1;border:3px solid #ffb3d9;background:radial-gradient(circle,#a63fd0,#6d2a9e);box-shadow:0 0 34px #ff7ac877}.b18 small{font:600 14px Inter;margin-top:4px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:22px}.pills i{font-style:normal;font-size:13px;padding:10px 12px;border-radius:99px;background:#2a104a99;border:1px solid #ffffff2e;text-align:left}
.wc .btn{width:100%;margin-top:10px;padding:16px;background:linear-gradient(90deg,#c13cff,#ff5f9e,#ffa45c)}.wc .btn.ghost{background:#ffffff10;color:#fff;border:1.5px solid #ffffffcc;box-shadow:none}

/* ===== Local-first card store =====
   Every card loaded from Firebase is saved in localStorage (as many as the browser allows).
   When storage is full the OLDEST cards are dropped automatically; the feed is always sorted newest-first. */
const CK="sx_cards_v2",MK="sx_meta_v2",CATK="sx_cats_v2";
const cmpC=(a,b)=>(b._s-a._s)||(b._n-a._n),gtK=(a,b)=>a[0]>b[0]||(a[0]==b[0]&&a[1]>b[1]);
const hyd=c=>{c.createdAt={toDate:()=>new Date(c._s*1000+Math.floor(c._n/1e6))};return c};
const ingest=d=>{const x=d.data(),ts=x.createdAt,{createdAt,updatedAt,...r}=x;return hyd({id:d.id,...r,_s:ts?.seconds??Math.floor(Date.now()/1000),_n:ts?.nanoseconds??0})};
function loadCache(){try{const a=JSON.parse(localStorage.getItem(CK)||"[]");return Array.isArray(a)?a.filter(c=>c&&c.id).map(hyd).sort(cmpC):[]}catch{return[]}}
function loadMeta(){try{const m=JSON.parse(localStorage.getItem(MK)||"{}");return m&&typeof m=="object"?m:{}}catch{return{}}}
function saveMeta(){try{localStorage.setItem(MK,JSON.stringify(S.meta))}catch{}}
function saveCache(){S.cards.sort(cmpC);const all=S.cards,n=all.length;
  if(!n){try{localStorage.removeItem(CK)}catch{}return}
  const put=k=>{try{localStorage.setItem(CK,JSON.stringify(all.slice(0,k).map(({createdAt,...r})=>r)));return true}catch{return false}};
  if(put(n))return;
  let k=n,ok=false;while(k>1){k=Math.max(1,k-Math.max(1,Math.floor(k*.04)));if(put(k)){ok=true;break}}
  if(!ok)return; /* storage unavailable: keep working from memory */
  S.cards=all.slice(0,k);const l=S.cards[k-1];S.meta.full=true;S.meta.oldest=[l._s,l._n];saveMeta()}
let _st;const saveSoon=()=>{clearTimeout(_st);_st=setTimeout(saveCache,1200)};
S.cards=loadCache();S.meta=loadMeta();S.mine=[];S.xtra=[];S.fw=new Set();S.fing=[];S.fers=[];
try{JSON.parse(localStorage.getItem(CATK)||"[]").forEach(n=>{if(!S.cats.includes(n))S.cats.push(n)})}catch{}
const getCard=id=>S.cards.find(x=>x.id==id)||S.mine.find(x=>x.id==id)||S.xtra.find(x=>x.id==id);

 const cat=e.target.closest("[data-cat]");if(cat){S.cat=cat.dataset.cat;if(!cat.closest("[data-go]")&&S.draw){document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.cat==S.cat));S.draw();return}}
 const a=e.target.closest("[data-act]");
 if(a){e.stopPropagation();const id=a.dataset.id,act=a.dataset.act;
  try{
    if(act=="glang"){setLang(LANG=="en"?"hi":"en");return}
    if(act=="menu"){openMenu();return}
     if(act=="notifs"){renderNotifs();askNotifPerm();return}
     if(act=="nclose"){$("#nsheet")?.remove();return}
     if(act=="nall"){const b=writeBatch(db);S.notifs.filter(n=>!n.read).slice(0,400).forEach(n=>{b.update(doc(db,NCOL,n.id),{read:true});n.read=true});refreshBell();await b.commit();return}
     if(act=="nopen"){const n=S.notifs.find(x=>x.id==id);if(n&&!n.read){n.read=true;updateDoc(doc(db,NCOL,id),{read:true}).catch(()=>{})}$("#nsheet")?.remove();refreshBell();go("card/"+a.dataset.c);return}
    if(act=="share"){await shareCard(id);return}
     if(!S.u&&act!="fclose")return toast(t("please_wait"));
     if(act=="loadnew"){await loadMoreUI();return}
     if(act=="flist"){const v=a.dataset.v;S.sv=v;S.snap=S[v].map(x=>v=="fers"?{id:x.followerId,n:x.followerName}:{id:x.followingId,n:x.followingName});renderSheet()}
  if(act=="fclose")$("#sheet")?.remove();
  if(act=="ftoggle"){await toggleFollow(id,a.dataset.n);renderSheet()}
  if(act=="monapply"){if(S.fers.length<MON.minFollowers)return toast(t("not_enough"));await setDoc(doc(db,"monetization",S.u.uid),{userId:S.u.uid,name:S.p?.name||"",followers:S.fers.length,status:"pending",createdAt:serverTimestamp()});toast(t("app_sent"));route()}
  if(act=="follow"){await toggleFollow(id,a.dataset.n);route()}
  if(act=="like"){const c=getCard(id),k=S.u.uid+"_"+id,r=doc(db,"likes",k),b=writeBatch(db),had=S.likes.has(id);
   if(had){b.delete(r);b.update(doc(db,"cards",id),{likesCount:increment(-1)})}else{b.set(r,{likeId:k,userId:S.u.uid,cardId:id,createdAt:serverTimestamp()});b.update(doc(db,"cards",id),{likesCount:increment(1)})}
   await b.commit();had?S.likes.delete(id):S.likes.add(id);c.likesCount=(c.likesCount||0)+(had?-1:1);saveSoon();route()}
  if(act=="bm"){const k=S.u.uid+"_"+id,r=doc(db,"bookmarks",k);if(S.bms.has(id)){await deleteDoc(r);S.bms.delete(id)}else{await setDoc(r,{bookmarkId:k,userId:S.u.uid,cardId:id,createdAt:serverTimestamp()});S.bms.add(id)}route()}
  if(act=="del"&&confirm(t("confirm_del"))){await deleteDoc(doc(db,"cards",id));dropCard(id);saveCache();toast(t("deleted"));route()}
  if(act=="dis"){await updateDoc(doc(db,"users",id),{disabled:a.dataset.v=="true"});adminView()}
  if(act=="addcat"){const n=$("#nc").value.trim();if(n){await addDoc(collection(db,"categories"),{name:n,createdAt:serverTimestamp()});await loadCats();adminView()}}
  }catch(x){toast(x.message.replace("Firebase: ",""))}return}
 const g=e.target.closest("[data-go]");if(g){const v=g.dataset.go;if(v=="create"&&S.u&&S.u.isAnonymous){if(await googleGate(true))go("create");return}location.hash=="#/"+v?route():go(v)}});

// ---- bottom nav + keyboard behaviour
let ly=0,H=innerHeight,kb=false,sw=false,fAt=0,kOpen=false;const grace=()=>Date.now()-fAt<1000;const navEl=()=>document.querySelector("nav.bot"),typing=()=>document.activeElement?.id=="q",showNav=()=>navEl()?.classList.remove("hide"),hideNav=()=>navEl()?.classList.add("hide");
addEventListener("scroll",()=>{const y=scrollY;if(Date.now()<(S.navLock||0)){ly=y;return}if(Math.abs(y-ly)<6)return;
 if(y>ly&&y>40){hideNav();if(typing()&&!grace())document.activeElement.blur()}else{if(!kb)showNav()}ly=y},{passive:true});
/* Header moves 1:1 with the scroll: slides up exactly as far as the page scrolls down, and comes back down at the same speed as the content scrolls up */
let hy=0;addEventListener("scroll",()=>{const y=scrollY,hd=document.querySelector(".top");
 if(hd&&!(typing()&&grace())){if(Date.now()>=(S.navLock||0)){const hh=hd.getBoundingClientRect().height,zf=window.ZF||1;let o=y<=0?0:Math.max(-hh,Math.min(0,(hd._o||0)-(y-hy)));hd._o=o;hd.style.transform=o?"translate3d(0,"+(o/zf)+"px,0)":""}}
 hy=y},{passive:true});
document.addEventListener("touchmove",e=>{if(typing()&&!grace()&&!(e.target.closest&&e.target.closest(".sw"))){sw=true;document.activeElement.blur()}},{passive:true});
document.addEventListener("focusin",e=>{if(e.target.matches("input,textarea,select")){kb=true;kOpen=false;fAt=Date.now();hideNav()}});
document.addEventListener("focusout",()=>{kb=false;if(!sw||scrollY<=40)showNav();sw=false});
addEventListener("resize",()=>{H=Math.max(H,innerHeight);if(kb){if(innerHeight<H-120)kOpen=true;else if(kOpen&&!grace()){kb=false;kOpen=false;if(typing())document.activeElement.blur();showNav()}}});
</script></body></html>
